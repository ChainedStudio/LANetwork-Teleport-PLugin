# lanetwork Teleport Configuration File

tpa:
  timeout: 60

rtp:
  min-radius: 1000
  max-radius: 5000
  max-attempts: 15
  allowed-worlds:
    - "world"
    - "world_nether"

sounds:
  teleport: "ENTITY_ENDERMAN_TELEPORT"
  send-request: "ENTITY_EXPERIENCE_ORB_PICKUP"
  receive-request: "BLOCK_NOTE_BLOCK_CHIME"

messages:
  prefix: "<gold>[LANetwork]</gold> "
  no-permission: "<red>You do not have permission to execute this!</red>"
  rtp-searching: "<yellow>Locating a safe landing zone...</yellow>"
  rtp-success: "<green>Successfully teleported to coordinates: <gold>%x%, %y%, %z%</gold>!</green>"

gui:
  title: "§6§lRTP Destination Selection"
  background-item: "minecraft:gray_stained_glass_pane"

  items:
    overworld_button:
      material: "minecraft:grass_block"
      slot: 11
      name: "§a§lOverworld Dimension"
      lore:
        - "§7Click to execute a random teleport"
        - "§7within the native overworld surface area."
      action-type: "WORLD"
      action-target: "world"

    nether_button:
      material: "minecraft:netherrack"
      slot: 15
      name: "§c§lNether Wastes"
      lore:
        - "§7Click to execute a random teleport"
        - "§7safely through the nether ceiling."
      action-type: "WORLD"
      action-target: "world_nether"